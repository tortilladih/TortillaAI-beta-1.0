<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10140f"><title>TortillaAI</title>
<style>

*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;color:var(--text);background:radial-gradient(ellipse at 75% 5%,rgba(126,139,78,.1),transparent 36%),var(--bg);font:14px/1.55 Inter,"Segoe UI",system-ui,sans-serif}button,select,textarea{font:inherit;color:inherit}.app{height:100%;display:flex}aside{width:265px;flex:0 0 265px;display:flex;flex-direction:column;padding:18px 14px 12px;border-right:1px solid var(--line);background:rgba(18,22,16,.92)}.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 18px}.brandname{font-size:16px;font-weight:750}.brandcap{display:block;color:var(--dim);font-size:10px;letter-spacing:.1em;text-transform:uppercase}.logo{filter:drop-shadow(0 4px 12px #d7a64933)}.new{width:100%;display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:linear-gradient(135deg,#e9b95720,#e9b95708);text-align:left;cursor:pointer}.new:hover,.mode:hover,.chat:hover{border-color:#e9b95766;background:#e9b95714}.plus{font-size:20px;color:var(--gold2)}.label{margin:20px 8px 8px;color:var(--dim);font-size:10px;font-weight:750;letter-spacing:.14em;text-transform:uppercase}.modes{display:grid;gap:4px}.mode{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--muted);text-align:left;cursor:pointer}.mode.active{border-color:#e9b95740;background:#e9b95715;color:var(--gold2)}.mode span:first-child{width:18px;text-align:center}.chatlist{min-height:40px;flex:1;overflow:auto}.chat{width:100%;display:flex;align-items:center;gap:7px;padding:7px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted);text-align:left;cursor:pointer}.chat.active{background:#ffffff0d;color:var(--text)}.chatname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}.dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}.del{opacity:0;border:0;background:none;color:var(--dim);cursor:pointer}.chat:hover .del{opacity:1}.del:hover{color:#ef8d83}.privacy{margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:#20271b;font-size:10px;color:var(--muted)}.privacy b{color:var(--green)}.privacy p{margin:4px 0 0}.foot{padding:9px 5px 0;color:var(--dim);font-size:9px}
main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:60px;flex:0 0 60px;padding:0 23px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.title{font-size:13px;font-weight:650}.controls{display:flex;align-items:center;gap:9px}.status{font-size:10px;color:var(--muted)}.status:before{content:"";display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%;background:#d0a74f}.status.online:before{background:#91c56d}.status.offline:before{background:#dc796d}.mlabel{font-size:10px;color:var(--dim);text-transform:uppercase}select{max-width:210px;border:1px solid var(--line);border-radius:8px;padding:7px 28px 7px 9px;background:#1b2019;font-size:11px}
#messages{flex:1;overflow:auto;padding:25px 20px 15px;display:flex;flex-direction:column;align-items:center;gap:16px;scroll-behavior:smooth}.welcome{width:min(100%,700px);margin:auto;text-align:center;padding:22px 0 32px;animation:rise .55s ease both}.welcome-logo{margin:0 auto 15px;animation:float 5s ease-in-out infinite}.eyebrow{color:var(--gold);font-size:10px;font-weight:750;letter-spacing:.16em;text-transform:uppercase;margin:0 0 7px}.welcome h1{margin:0;font-size:clamp(27px,3.3vw,40px);line-height:1.15;letter-spacing:-.05em}.welcome h1 em{font-style:normal;color:var(--gold2)}.welcome-copy{color:var(--muted);font-size:13px;max-width:480px;margin:11px auto 22px}.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;width:min(100%,550px);margin:auto;text-align:left}.suggestion{min-height:62px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#1b2019;cursor:pointer;text-align:left;transition:.2s}.suggestion:hover{transform:translateY(-2px);border-color:#e9b95766}.suggestion b{display:block;font-size:11px}.suggestion span{color:var(--dim);font-size:10px}
.row{width:min(100%,800px);display:flex;gap:10px;align-items:flex-start;animation:rise .25s ease both}.userrow{justify-content:flex-end}.mark{display:grid;place-items:center;flex:0 0 27px;height:27px;border-radius:8px;background:#e9b95718;color:var(--gold)}.msg{max-width:86%;padding:10px 13px;border:1px solid var(--line);border-radius:13px;background:#1b2019;overflow-wrap:anywhere}.msg.user{background:#e9b95713;border-color:#e9b95730;border-top-right-radius:5px}.msg.assistant{border-top-left-radius:5px}.msg.error{color:#ffaaa0}.msg p{margin:0 0 9px}.msg p:last-child{margin:0}.msg h1,.msg h2,.msg h3{margin:12px 0 5px;color:var(--gold2)}.msg h1{font-size:19px}.msg h2{font-size:16px}.msg h3{font-size:14px}.msg ul{margin:3px 0 9px;padding-left:21px}.msg code:not(pre code){padding:2px 4px;border-radius:4px;background:#0004;color:#f3d58f;font: .9em Consolas,monospace}.code{margin:9px 0 3px;border:1px solid var(--line);border-radius:9px;background:#10130f;overflow:hidden}.codehead{display:flex;justify-content:space-between;padding:4px 9px;border-bottom:1px solid var(--line);color:var(--dim);font-size:10px}.copy{border:0;border-radius:5px;background:#ffffff10;color:var(--muted);cursor:pointer}.code pre{margin:0;padding:11px;overflow:auto;color:#e3e7d9;font:12px/1.5 Consolas,monospace}.actions{display:flex;gap:12px;margin-top:6px}.action{padding:0;border:0;background:none;color:var(--dim);font-size:10px;cursor:pointer}.action:hover{color:var(--gold2)}.typing{display:flex;gap:4px;padding:5px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:bounce 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.composerarea{width:min(100%,850px);padding:7px 20px 14px;margin:auto}.composer{display:flex;align-items:flex-end;gap:8px;padding:8px 9px 8px 14px;border:1px solid #ffffff26;border-radius:14px;background:#1c2119;transition:.2s}.composer:focus-within{border-color:#e9b95766;box-shadow:0 0 0 3px #e9b95710}textarea{flex:1;min-width:0;resize:none;max-height:170px;min-height:29px;padding:4px 0;border:0;outline:0;background:transparent;color:var(--text)}textarea::placeholder{color:#777e70}.voice,.send{display:grid;place-items:center;flex:0 0 36px;width:36px;height:36px;border:1px solid var(--line);border-radius:9px;background:#ffffff08;color:var(--muted);cursor:pointer}.voice:hover{color:var(--gold2)}.voice.listening{color:#ffaaa0;border-color:#ef8d8380;animation:pulse 1.2s infinite}.send{border:0;background:linear-gradient(135deg,#edc875,#d6a447);color:#252619}.send:disabled{opacity:.5;cursor:wait}.hint{text-align:center;margin:6px 0 0;color:var(--dim);font-size:10px}.toast{position:fixed;left:50%;bottom:80px;z-index:5;max-width:90vw;padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:#242a20;opacity:0;transform:translate(-50%,10px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes float{50%{transform:translateY(-5px)}}@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-5px);opacity:1}}@keyframes pulse{50%{box-shadow:0 0 0 5px #ef8d8317}}@media(max-width:800px){aside{width:220px;flex-basis:220px;padding:12px 9px}.top{padding:0 12px}.mlabel{display:none}}@media(max-width:620px){aside{width:54px;flex-basis:54px;padding:10px 6px}.brand{justify-content:center;padding:3px 0 14px}.brandcopy,.newlabel,.label,.mode span:last-child,.chatlist,.privacy,.foot{display:none}.new{justify-content:center;padding:8px 4px}.modes{margin-top:8px}.mode{justify-content:center;padding:9px 3px}.mode span:first-child{width:auto}.top{height:52px;flex-basis:52px}.status{font-size:0}.status:before{margin:0}select{max-width:125px}.suggestions{grid-template-columns:1fr}.welcome{padding:5px 0}.msg{max-width:91%;font-size:13px}#messages{padding:14px 9px}.composerarea{padding:6px 8px 10px}.hint{font-size:9px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style></head>
<body><div class="app"><aside>
<div class="brand"><svg class="logo" width="39" height="39" viewBox="0 0 64 64" aria-label="TortillaAI"><defs><linearGradient id="lg" x1="9" y1="7" x2="54" y2="57"><stop stop-color="#F8D88F"/><stop offset="1" stop-color="#D99E3C"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="19" fill="#22291D" stroke="#414735"/><circle cx="32" cy="32" r="20" fill="url(#lg)"/><path d="M21 25h22M32 25v17M25 25v5.5c0 4 3 6.5 7 6.5s7-2.5 7-6.5V25" fill="none" stroke="#34442B" stroke-width="3.5" stroke-linecap="round"/></svg><div class="brandcopy"><span class="brandname">TortillaAI</span><span class="brandcap">Dein lokaler Assistent</span></div></div>
<button class="new" id="new"><span class="plus">＋</span><span class="newlabel">Neuer Chat</span></button>
<div class="label">Arbeitsbereiche</div><nav class="modes"><button class="mode" data-mode="chat"><span>✦</span><span>Chat</span></button><button class="mode" data-mode="code"><span>⌘</span><span>Code-Assistent</span></button><button class="mode" data-mode="security"><span>⬡</span><span>Cybersecurity</span></button></nav>
<div class="label">Deine Chats</div><div class="chatlist" id="chatlist"></div>
<div class="privacy"><b>Ollama auf deinem PC</b><p>Nachrichten gehen an das lokale Modell. Sprach-zu-Text kann einen Online-Dienst verwenden.</p></div><div class="foot">TortillaAI · Lokal gedacht.</div>
</aside><main><header class="top"><div class="title" id="title">Chat</div><div class="controls"><span class="status" id="status">Verbinde …</span><label class="mlabel" for="model">Modell</label><select id="model"><option value="">Suche Modelle …</option></select></div></header>
<section id="messages" aria-live="polite"></section>
<div class="composerarea"><form class="composer" id="form"><textarea id="input" placeholder="Schreib an TortillaAI …" rows="1" required aria-label="Nachricht"></textarea><button class="voice" id="voice" type="button" title="Spracheingabe starten" aria-label="Spracheingabe starten"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="9" y="3" width="6" height="12" rx="3" stroke="currentColor" stroke-width="1.7"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21m-3 0h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button><button class="send" id="send" aria-label="Senden">➤</button></form><p class="hint">Enter senden · Shift + Enter neue Zeile · 🎙 Spracheingabe</p></div></main></div><div class="toast" id="toast"></div>
<script>
const KEY='tortillaai.chats.v2',INFO={chat:{title:'Chat',eyebrow:'Dein lokaler Chat',heading:'Was möchtest du <em>wissen?</em>',copy:'Frag drauflos. Dein Assistent hilft dir beim Lernen, Planen, Schreiben und Ideenfinden.',items:[['Etwas verstehen','Erkläre mir ein schwieriges Thema einfach und mit einem Beispiel.'],['Einen Plan machen','Hilf mir, einen guten Plan für heute zu erstellen.'],['Ideen sammeln','Gib mir drei kreative Ideen für heute.'],['Text schreiben','Schreibe mir einen kurzen Text über: ']]},code:{title:'Code-Assistent',eyebrow:'Dein Coding-Bereich',heading:'Was bauen wir <em>heute?</em>',copy:'Lass dir Code schreiben, Fehler erklären und technische Schritte verständlich zeigen.',items:[['Code schreiben','Schreibe eine Funktion, die '],['Fehler verstehen','Erkläre diesen Fehler und zeige eine Lösung: '],['Projekt starten','Erstelle ein kleines Beispielprojekt für '],['Code erklären','Erkläre diesen Code Schritt für Schritt: ']]},security:{title:'Cybersecurity',eyebrow:'Sicher lernen und schützen',heading:'Sicherheit beginnt mit <em>Wissen.</em>',copy:'Lerne defensive Sicherheit, sichere deine Geräte und verstehe Risiken in autorisierten Übungsumgebungen.',items:[['PC absichern','Gib mir eine Checkliste, um meinen Windows-PC besser abzusichern.'],['Phishing erkennen','Erkläre typische Phishing-Merkmale mit sicheren Beispielen.'],['Logs verstehen','Wie erkenne ich verdächtige Anmeldeversuche in meinen eigenen Systemprotokollen?'],['Sicher üben','Schlage ein legales Cybersecurity-Lernlabor für Anfänger vor.']]}};
const msgEl=document.querySelector('#messages'),modelEl=document.querySelector('#model'),input=document.querySelector('#input'),send=document.querySelector('#send'),statusEl=document.querySelector('#status'),list=document.querySelector('#chatlist'),toast=document.querySelector('#toast');let chats=readChats(),current=null,recognition=null,toastTimer;
function readChats(){try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x.filter(c=>c&&c.id&&Array.isArray(c.messages)&&INFO[c.mode]):[]}catch{return []}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(chats))}catch{}drawList()}
function active(){return chats.find(c=>c.id===current)}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function notify(t){toast.textContent=t;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),3300)}
function setStatus(state,text){statusEl.className='status '+state;statusEl.textContent=text}
function sys(mode){if(mode==='code')return 'Du bist TortillaAI, ein geduldiger Programmierassistent. Antworte auf Deutsch. Schreibe gut lesbaren Code in Markdown-Codeblöcken, nenne die Sprache und erkläre kurz Nutzung und Annahmen. Behaupte nie, Dateien geändert oder Code ausgeführt zu haben, wenn du es nicht getan hast.';if(mode==='security')return 'Du bist TortillaAI, ein Assistent für defensive Cybersecurity und sicheres Lernen. Antworte auf Deutsch. Hilf bei Schutz, sicherer Konfiguration, Erkennung, Incident Response, Konzepten und autorisierten Übungslaboren. Gib keine Anleitung für unbefugtes Eindringen, Zugangsdiebstahl, Schadsoftware oder das Umgehen von Schutzmaßnahmen. Lenke solche Fragen zu sicheren defensiven Alternativen.';return 'Du bist TortillaAI, ein freundlicher lokaler KI-Assistent. Antworte klar und konkret auf Deutsch.'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function md(source){const blocks=[];let text=String(source||'').replace(/\x60\x60\x60([\w.+-]*)\n?([\s\S]*?)\x60\x60\x60/g,(_m,lang,code)=>{let i=blocks.length;blocks.push('<div class="code"><div class="codehead"><span>'+esc(lang||'Code')+'</span><button class="copy">Kopieren</button></div><pre><code>'+esc(code.replace(/\n$/,''))+'</code></pre></div>');return '__CODE'+i+'__'});function inline(s){return esc(s).replace(/\x60([^\x60]+)\x60/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>')}let out=[],p=[],ul=[];function fp(){if(p.length){out.push('<p>'+p.map(inline).join('<br>')+'</p>');p=[]}}function fu(){if(ul.length){out.push('<ul>'+ul.map(x=>'<li>'+inline(x)+'</li>').join('')+'</ul>');ul=[]}}for(const line of text.split('\n')){let c=line.match(/^__CODE(\d+)__$/),h=line.match(/^(#{1,3})\s+(.+)$/),li=line.match(/^\s*[-*]\s+(.+)$/);if(c){fp();fu();out.push(blocks[+c[1]])}else if(h){fp();fu();let n=h[1].length;out.push('<h'+n+'>'+inline(h[2])+'</h'+n+'>')}else if(li){fp();ul.push(li[1])}else if(!line.trim()){fp();fu()}else{fu();p.push(line)}}fp();fu();return out.join('')}
function welcome(){const inf=INFO[active()?.mode||'chat'],d=document.createElement('div');d.className='welcome';d.innerHTML='<svg class="logo welcome-logo" width="70" height="70" viewBox="0 0 64 64"><defs><linearGradient id="hero" x1="9" y1="7" x2="54" y2="57"><stop stop-color="#F8D88F"/><stop offset="1" stop-color="#D99E3C"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="19" fill="#22291D" stroke="#414735"/><circle cx="32" cy="32" r="20" fill="url(#hero)"/><path d="M21 25h22M32 25v17M25 25v5.5c0 4 3 6.5 7 6.5s7-2.5 7-6.5V25" fill="none" stroke="#34442B" stroke-width="3.5" stroke-linecap="round"/></svg><p class="eyebrow"></p><h1></h1><p class="welcome-copy"></p><div class="suggestions"></div>';d.querySelector('.eyebrow').textContent=inf.eyebrow;d.querySelector('h1').innerHTML=inf.heading;d.querySelector('.welcome-copy').textContent=inf.copy;for(const x of inf.items){const b=document.createElement('button');b.className='suggestion';b.innerHTML='<b>'+esc(x[0])+'</b><span>Zum Starten anklicken</span>';b.onclick=()=>{input.value=x[1];resize();input.focus()};d.querySelector('.suggestions').append(b)}return d}
function drawMessage(m,i){const r=document.createElement('div');r.className='row '+(m.role==='user'?'userrow':'');r.dataset.index=i;if(m.role==='assistant'){const mark=document.createElement('span');mark.className='mark';mark.textContent='✦';r.append(mark)}const box=document.createElement('div');box.className='msg '+m.role+(m.error?' error':'');if(m.pending)box.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';else if(m.role==='assistant')box.innerHTML=md(m.content);else box.textContent=m.content;r.append(box);if(m.role==='assistant'&&!m.pending&&!m.error){const a=document.createElement('div');a.className='actions';a.innerHTML='<button class="action" data-action="copy">Antwort kopieren</button><button class="action" data-action="speak">Vorlesen</button>';box.append(a)}return r}
function drawList(){list.replaceChildren();for(const c of [...chats].sort((a,b)=>b.updatedAt-a.updatedAt)){const row=document.createElement('div');row.className='chat'+(c.id===current?' active':'');row.dataset.id=c.id;const dot=document.createElement('span');dot.className='dot';dot.style.background=c.mode==='code'?'#cf9ee8':c.mode==='security'?'#8fb986':'#e9b957';const name=document.createElement('span');name.className='chatname';name.textContent=c.title;const del=document.createElement('button');del.className='del';del.textContent='×';del.title='Chat löschen';del.dataset.delete=c.id;row.append(dot,name,del);list.append(row)}if(!chats.length){const e=document.createElement('div');e.style.cssText='padding:6px;color:var(--dim);font-size:10px';e.textContent='Deine Chats erscheinen hier.';list.append(e)}}
function draw(){const c=active();msgEl.replaceChildren();document.querySelector('#title').textContent=INFO[c?.mode||'chat'].title;document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===(c?.mode||'chat')));if(!c||!c.messages.length)msgEl.append(welcome());else c.messages.forEach((m,i)=>msgEl.append(drawMessage(m,i)));msgEl.scrollTop=msgEl.scrollHeight;drawList()}
function create(mode){const c={id:id(),mode:INFO[mode]?mode:'chat',title:'Neuer '+INFO[mode||'chat'].title,messages:[],updatedAt:Date.now()};chats.unshift(c);current=c.id;save();draw();input.focus()}
function modeClick(mode){const c=[...chats].filter(x=>x.mode===mode).sort((a,b)=>b.updatedAt-a.updatedAt)[0];if(c){current=c.id;draw()}else create(mode)}
function resize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,170)+'px'}
async function loadModels(){try{const r=await fetch('/api/tags');if(!r.ok)throw Error();const d=await r.json(),old=modelEl.value,models=d.models||[];modelEl.replaceChildren(...models.map(m=>{const o=document.createElement('option');o.value=m.name;o.textContent=m.name;return o}));if(!models.length){modelEl.innerHTML='<option value="">Kein Modell geladen</option>';setStatus('offline','Kein Modell');return}if(models.some(m=>m.name===old))modelEl.value=old;setStatus('online','Ollama verbunden')}catch{modelEl.innerHTML='<option value="">Ollama nicht erreichbar</option>';setStatus('offline','Ollama nicht erreichbar')}}
document.querySelector('#new').onclick=()=>create(active()?.mode||'chat');document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>modeClick(b.dataset.mode));list.addEventListener('click',e=>{const del=e.target.closest('[data-delete]');if(del){e.stopPropagation();chats=chats.filter(c=>c.id!==del.dataset.delete);if(current===del.dataset.delete)current=null;save();if(!current){const latest=[...chats].sort((a,b)=>b.updatedAt-a.updatedAt)[0];if(latest)current=latest.id;else{create('chat');return}}draw();return}const row=e.target.closest('.chat');if(row){current=row.dataset.id;draw()}});input.addEventListener('input',resize);
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const text=input.value.trim(),model=modelEl.value;if(!text||!model||send.disabled)return;if(!active())create('chat');const c=active(),user={role:'user',content:text};c.messages.push(user);if(c.messages.filter(m=>m.role==='user').length===1)c.title=text.slice(0,45)+(text.length>45?'…':'');c.updatedAt=Date.now();input.value='';resize();save();msgEl.querySelector('.welcome')?.remove();msgEl.append(drawMessage(user,c.messages.length-1));send.disabled=true;const pending=drawMessage({role:'assistant',pending:true},c.messages.length);msgEl.append(pending);msgEl.scrollTop=msgEl.scrollHeight;try{const body={model,messages:[{role:'system',content:sys(c.mode)},...c.messages.map(m=>({role:m.role,content:m.content}))],stream:false},r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error||'Anfrage fehlgeschlagen');const answer=d.message?.content||'(Keine Antwort)';c.messages.push({role:'assistant',content:answer});c.updatedAt=Date.now();save();pending.replaceWith(drawMessage(c.messages.at(-1),c.messages.length-1))}catch(err){pending.replaceWith(drawMessage({role:'assistant',content:'Verbindung fehlgeschlagen. Prüfe, ob Ollama läuft und ein Modell geladen ist. '+(err?.message||''),error:true},c.messages.length));setStatus('offline','Verbindung prüfen')}finally{send.disabled=false;input.focus();msgEl.scrollTop=msgEl.scrollHeight}});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.querySelector('#form').requestSubmit()}});
msgEl.addEventListener('click',async e=>{const cb=e.target.closest('.copy');if(cb){try{await navigator.clipboard.writeText(cb.closest('.code').querySelector('code').textContent);notify('Code kopiert.')}catch{notify('Kopieren nicht verfügbar.')}return}const b=e.target.closest('[data-action]');if(!b)return;const m=active()?.messages[Number(b.closest('.row').dataset.index)];if(!m)return;if(b.dataset.action==='copy'){try{await navigator.clipboard.writeText(m.content);notify('Antwort kopiert.')}catch{notify('Kopieren nicht verfügbar.')}}else if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(m.content);u.lang='de-DE';speechSynthesis.speak(u)}else notify('Vorlesen wird nicht unterstützt.')});
const voice=document.querySelector('#voice');voice.onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){notify('Spracherkennung nicht verfügbar. Nutze unter Windows Win + H.');return}if(recognition){recognition.stop();return}const consent='tortillaai.voice-consent';if(!localStorage.getItem(consent)){if(!confirm('Die Spracherkennung deines Browsers kann Audio an einen Online-Sprachdienst übertragen. Der erkannte Text wird danach an Ollama auf deinem PC gesendet. Fortfahren?'))return;localStorage.setItem(consent,'ja')}recognition=new SR();recognition.lang='de-DE';recognition.interimResults=true;recognition.continuous=false;voice.classList.add('listening');recognition.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;input.value=t;resize()};recognition.onerror=e=>notify(e.error==='not-allowed'?'Mikrofonzugriff wurde nicht erlaubt.':'Spracheingabe fehlgeschlagen: '+e.error);recognition.onend=()=>{recognition=null;voice.classList.remove('listening');input.focus()};try{recognition.start()}catch{recognition=null;voice.classList.remove('listening');notify('Mikrofon konnte nicht gestartet werden.')}};
if(chats.length)current=[...chats].sort((a,b)=>b.updatedAt-a.updatedAt)[0].id;draw();loadModels();setInterval(loadModels,20000);
</script></body></html>
